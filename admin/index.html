<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin kuesioner</title>
<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../config.js"></script>
<script src="../fmt.js"></script>
</head>
<body>
<main id="app">Memuat…</main>
<script>
const db = supabase.createClient(CFG.url, CFG.key), app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = {text:'Teks singkat',paragraph:'Paragraf',radio:'Pilihan ganda',checkbox:'Kotak centang',dropdown:'Dropdown',likert:'Skala 1-5',number:'Angka',date:'Tanggal',info:'Keterangan (bukan pertanyaan)'};
const OPT = ['radio','checkbox','dropdown'];
const LK = ['Sangat tidak setuju', 'Sangat setuju'];
const L = j => String.fromCharCode(65 + j);
let S, Q = [], del = [];

async function boot() {
  const { data: { session } } = await db.auth.getSession();
  session ? list() : login();
}

function login() {
  app.innerHTML = `<div class="card"><h1>Admin</h1><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Kata sandi"><p class="err" id="err"></p><button class="p" id="go">Masuk</button></div>`;
  $('go').onclick = async () => {
    const { error } = await db.auth.signInWithPassword({ email: $('em').value, password: $('pw').value });
    error ? $('err').textContent = error.message : boot();
  };
}

async function list() {
  const { data } = await db.from('surveys').select('*').order('created_at', { ascending: false });
  app.innerHTML = `<div class="row"><h1 class="g">Kuesioner</h1><button class="p" id="new">Buat kuesioner</button><button id="out">Keluar</button></div>`
    + ((data || []).map(s => `<div class="card row"><div class="g"><b>${esc(plain(s.title))}</b><div class="mut">${s.status}</div></div><button data-id="${s.id}">Kelola</button></div>`).join('') || '<p class="mut">Belum ada kuesioner. Klik "Buat kuesioner".</p>');
  $('out').onclick = async () => { await db.auth.signOut(); login(); };
  $('new').onclick = async () => {
    const r = await db.from('surveys').insert({ title: 'Kuesioner baru' }).select().single();
    r.error ? alert(r.error.message) : edit(r.data.id);
  };
  app.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => edit(b.dataset.id));
}

async function edit(id) {
  S = (await db.from('surveys').select('*').eq('id', id).single()).data;
  Q = (await db.from('questions').select('*').eq('survey_id', id).order('position')).data || [];
  Q.forEach(q => { if (q.type === 'likert') q.options = lkNorm(q.options); });
  del = [];
  const link = location.origin + '/?s=' + S.id;
  const tb = (id, ls) => `<div class="row tb"><span class="mut">Format:</span><button data-s="${id}" data-f="b"><b>B</b></button><button data-s="${id}" data-f="i"><i>I</i></button>${ls ? `<button data-s="${id}" data-f="ol">1. Daftar</button><button data-s="${id}" data-f="ul">• Daftar</button>` : ''}</div>`;
  const sel = (arr, v) => arr.map(([k, t]) => `<option value="${k}"${v === k ? ' selected' : ''}>${t}</option>`).join('');
  app.innerHTML = `<div class="row"><button id="back">Kembali</button><button id="ans">Lihat jawaban</button><button class="d" id="rm">Hapus kuesioner</button></div>
  <div class="card"><h2>Pengaturan</h2>
  ${tb('t')}<input id="t" value="${esc(S.title)}" placeholder="Judul">${tb('d', 1)}<textarea id="d" placeholder="Deskripsi">${esc(S.description)}</textarea>
  ${tb('c', 1)}<textarea id="c" placeholder="Teks persetujuan (informed consent). Kosongkan jika tidak perlu.">${esc(S.consent)}</textarea>
  <div class="mut" style="margin:8px 0 4px">Pratinjau judul dan deskripsi</div><div class="hero" id="hp"></div>
  <div class="row"><select class="g" id="i">${sel([['anonim','Responden anonim'],['nama','Wajib isi nama'],['nama_email','Wajib isi nama dan email']], S.identity)}</select>
  <select class="g" id="st">${sel([['draft','Draft (belum bisa diisi)'],['buka','Dibuka'],['tutup','Ditutup']], S.status)}</select></div>
  <p class="mut">Link responden: <a href="${link}" target="_blank">${link}</a></p></div>
  <h2>Pertanyaan</h2><div id="qs"></div>
  <div class="row"><button id="add">Tambah pertanyaan</button><button id="addi">Tambah keterangan</button><button class="p" id="save">Simpan semua</button><span id="msg" class="mut"></span></div>`;
  $('back').onclick = list;
  const hp = () => { $('hp').innerHTML = `<h1>${fmtI($('t').value)}</h1>${$('d').value ? `<div class="rt">${fmt($('d').value)}</div>` : ''}`; };
  $('t').oninput = $('d').oninput = hp; hp();
  app.querySelectorAll('button[data-s]').forEach(b => b.onclick = () => fmtEl($(b.dataset.s), b.dataset.f));
  $('ans').onclick = responses;
  $('rm').onclick = async () => { if (confirm('Hapus kuesioner beserta semua jawabannya?')) { await db.from('surveys').delete().eq('id', S.id); list(); } };
  $('addi').onclick = () => { Q.push({ id: null, text: '', type: 'info', required: false, options: ['banner'] }); drawQ(); };
  $('add').onclick = () => { Q.push({ id: null, text: '', type: 'text', required: false, options: [] }); drawQ(); };
  $('qs').oninput = $('qs').onchange = e => {
    const t = e.target, k = t.dataset.k; if (!k) return;
    const q = Q[t.dataset.i];
    if (k === 'opt') { q.options[t.dataset.j] = t.value; return; }
    if (k === 'lkl') { q.options.labels[t.dataset.j] = t.value; return; }
    if (k === 'lkn') {
      const nn = +t.value, old = q.options.labels;
      q.options = { n: nn, labels: Array.from({ length: nn }, (_, i) => i === 0 ? old[0] : i === nn - 1 ? old[old.length - 1] : (i < old.length - 1 ? old[i] : '')) };
      drawQ(); return;
    }
    if (k === 'sty') { q.options = [t.value]; drawQ(); return; }
    const prev = q.type;
    q[k] = k === 'required' ? t.checked : t.value;
    if (k === 'text' && q.type === 'info') { const pv = $('pv' + t.dataset.i); if (pv) pv.innerHTML = fmt(q.text); }
    if (k === 'type') {
      if (q.type === 'info') { q.required = false; q.options = ['banner']; }
      else if (q.type === 'likert') q.options = lkNorm();
      else if (prev === 'info' || prev === 'likert') q.options = OPT.includes(q.type) ? ['', ''] : [];
      else if (OPT.includes(q.type) && !(q.options || []).length) q.options = ['', ''];
      drawQ();
    }
  };
  $('qs').onclick = e => {
    const a = e.target.dataset.a, i = +e.target.dataset.i; if (!a) return;
    if (a === 'fmt') { applyFmt(i, e.target.dataset.f); return; }
    if (a === 'ao') Q[i].options.push('');
    else if (a === 'ro') Q[i].options.splice(+e.target.dataset.j, 1);
    else if (a === 'rm') { if (Q[i].id) del.push(Q[i].id); Q.splice(i, 1); }
    else { const j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= Q.length) return; [Q[i], Q[j]] = [Q[j], Q[i]]; }
    drawQ();
    if (a === 'ao') [...$('qs').querySelectorAll(`[data-i="${i}"][data-k="opt"]`)].pop()?.focus();
  };
  $('save').onclick = save;
  drawQ();
}

function applyFmt(i, f) { fmtEl(document.querySelector(`#qs textarea[data-i="${i}"][data-k="text"]`), f); }

function fmtEl(ta, f) {
  const v = ta.value;
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (f === 'b' || f === 'i') {
    const m = f === 'b' ? '**' : '*';
    ta.value = v.slice(0, s) + m + v.slice(s, e) + m + v.slice(e);
    ta.setSelectionRange(s + m.length, e + m.length);
  } else {
    const ls = s ? v.lastIndexOf('\n', s - 1) + 1 : 0;
    const out = v.slice(ls, e).split('\n').map((l, n) => (f === 'ol' ? (n + 1) + '. ' : f === 'ul' ? '- ' : '# ') + l).join('\n');
    ta.value = v.slice(0, ls) + out + v.slice(e);
    ta.setSelectionRange(ls, ls + out.length);
  }
  ta.focus();
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

function drawQ() {
  let n = 0;
  const ctl = i => `<button data-a="up" data-i="${i}">Naik</button><button data-a="dn" data-i="${i}">Turun</button><button class="d" data-a="rm" data-i="${i}">Hapus</button>`;
  const typeSel = (q, i) => `<select class="g" data-i="${i}" data-k="type">${Object.entries(T).map(([k, v]) => `<option value="${k}"${q.type === k ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
  const fb = (i, f, label) => `<button data-a="fmt" data-f="${f}" data-i="${i}">${label}</button>`;
  $('qs').innerHTML = Q.map((q, i) => q.type === 'info' ? `<div class="card">
    <div class="row"><span class="n" style="padding:0 10px">Keterangan</span>${typeSel(q, i)}${ctl(i)}</div>
    <div class="row tb">${fb(i, 'h', 'Judul')}${fb(i, 'b', '<b>B</b>')}${fb(i, 'i', '<i>I</i>')}${fb(i, 'ol', '1. Daftar')}${fb(i, 'ul', '• Daftar')}
    <select class="g" data-i="${i}" data-k="sty">${[['banner', 'Banner ungu'], ['soft', 'Kotak lembut'], ['kartu', 'Kartu putih']].map(([k, t]) => `<option value="${k}"${(q.options || [])[0] === k ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
    <textarea style="min-height:140px" data-i="${i}" data-k="text" placeholder="Tulis keterangan di sini…">${esc(q.text)}</textarea>
    <div class="mut" style="margin:8px 0 4px">Pratinjau (begini tampilannya untuk responden)</div>
    <div class="info ${esc((q.options || [])[0] || 'banner')}" id="pv${i}">${fmt(q.text)}</div></div>`
  : `<div class="card">
    <div class="row"><span class="n">${++n}</span><input class="g" data-i="${i}" data-k="text" value="${esc(q.text)}" placeholder="Tulis pertanyaan"></div>
    <div class="row">${typeSel(q, i)}
    <label class="o"><input type="checkbox" data-i="${i}" data-k="required"${q.required ? ' checked' : ''}>Wajib diisi</label>${ctl(i)}</div>
    ${OPT.includes(q.type) ? `<div class="mut" style="margin-bottom:6px">Pilihan jawaban</div>${(q.options || []).map((o, j) => `<div class="row opt"><span class="bd">${L(j)}</span><input class="g" data-i="${i}" data-j="${j}" data-k="opt" value="${esc(o)}" placeholder="Isi opsi ${L(j)}"><button class="d" data-a="ro" data-i="${i}" data-j="${j}" title="Hapus opsi">✕</button></div>`).join('')}<button data-a="ao" data-i="${i}">Tambah opsi</button>` : ''}${q.type === 'likert' ? `<div class="row"><span class="mut">Jumlah skala</span><select data-i="${i}" data-k="lkn" style="width:auto">${[2,3,4,5,6,7,8,9,10].map(c => `<option value="${c}"${q.options.n === c ? ' selected' : ''}>1 sampai ${c}</option>`).join('')}</select></div><div class="mut" style="margin-bottom:6px">Keterangan tiap angka (boleh dikosongkan)</div>${q.options.labels.map((t, j) => `<div class="row opt"><span class="bd">${j + 1}</span><input class="g" data-i="${i}" data-j="${j}" data-k="lkl" value="${esc(t)}" placeholder="Keterangan untuk angka ${j + 1}"></div>`).join('')}` : ''}</div>`).join('')
    || '<p class="mut">Belum ada pertanyaan. Klik "Tambah pertanyaan" atau "Tambah keterangan".</p>';
}

async function save() {
  const msg = $('msg');
  if (Q.some(q => !q.text.trim())) { msg.textContent = 'Ada pertanyaan yang masih kosong.'; return; }
  Q.forEach(q => { if (OPT.includes(q.type)) q.options = (q.options || []).map(s => s.trim()).filter(Boolean); });
  if (Q.some(q => OPT.includes(q.type) && q.options.length < 2)) { msg.textContent = 'Pertanyaan bertipe pilihan butuh minimal 2 opsi.'; drawQ(); return; }
  msg.textContent = 'Menyimpan…';
  const s = await db.from('surveys').update({ title: $('t').value, description: $('d').value, consent: $('c').value, identity: $('i').value, status: $('st').value }).eq('id', S.id);
  const rows = Q.map((q, i) => ({ id: q.id || crypto.randomUUID(), survey_id: S.id, position: i, text: q.text, type: q.type, required: !!q.required, options: OPT.includes(q.type) || q.type === 'info' || q.type === 'likert' ? q.options : [] }));
  let e = s.error;
  if (!e && del.length) e = (await db.from('questions').delete().in('id', del)).error;
  if (!e && rows.length) e = (await db.from('questions').upsert(rows)).error;
  if (e) { msg.textContent = 'Gagal menyimpan: ' + e.message; return; }
  Q.forEach((q, i) => q.id = rows[i].id); del = [];
  S = { ...S, title: $('t').value, status: $('st').value };
  msg.textContent = 'Tersimpan.';
}

async function responses() {
  const qs = Q.filter(q => q.id && q.type !== 'info');
  const { data: R, error } = await db.from('responses').select('*, answers(question_id,value)').eq('survey_id', S.id).order('created_at');
  if (error) { alert(error.message); return; }
  const head = ['No', 'Waktu', 'Nama', 'Email', ...qs.map(q => q.text)];
  const rows = (R || []).map((r, n) => {
    const m = Object.fromEntries(r.answers.map(a => [a.question_id, a.value]));
    return [n + 1, new Date(r.created_at).toLocaleString('id-ID'), r.name || '', r.email || '', ...qs.map(q => m[q.id] || '')];
  });
  app.innerHTML = `<div class="row"><button id="back">Kembali</button><h2 class="g" style="margin:0">${esc(plain(S.title))}: ${rows.length} responden</h2><button class="p" id="xl"${rows.length ? '' : ' disabled'}>Export Excel</button></div>
  <div class="card tw">${rows.length ? `<table><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}<th></th></tr>`
    + rows.map((r, i) => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}<td><button class="d" data-id="${R[i].id}">Hapus</button></td></tr>`).join('') + '</table>' : '<p class="mut">Belum ada yang menjawab.</p>'}</div>`;
  $('back').onclick = () => edit(S.id);
  $('xl').onclick = () => {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...rows]), 'Jawaban');
    XLSX.writeFile(wb, (plain(S.title).replace(/[^\w]+/g, '_') || 'jawaban') + '.xlsx');
  };
  app.querySelectorAll('button[data-id]').forEach(b => b.onclick = async () => {
    if (confirm('Hapus jawaban responden ini?')) { await db.from('responses').delete().eq('id', b.dataset.id); responses(); }
  });
}
boot();
</script>
</body>
</html>
